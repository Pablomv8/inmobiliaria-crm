{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio{% endblock %}</title>
    <!-- CSS enlazado desde carpeta estática -->
    <link rel="stylesheet" href="{% static 'css/main.min.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="/">Inicio</a>
            <a href="/">Blog</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- El contenido específico de cada página irá aquí -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Mi Empresa</p>
    </footer>
</body>
</html>
