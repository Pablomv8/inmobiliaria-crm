{% if status == "completed" %}
    <span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-sm font-black text-emerald-700" title="Cita completada" aria-label="Cita completada">✓</span>
{% elif status == "cancelled" %}
    <span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-red-100 text-sm font-black text-red-700" title="Cita cancelada" aria-label="Cita cancelada">✕</span>
{% endif %}
