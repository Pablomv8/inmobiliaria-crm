{% extends "base.html" %}

{% block content %}

<div class="max-w-7xl mx-auto ml-2">

    <div class="mb-8">

        <h1 class="text-3xl font-bold">
            Agenda
        </h1>

        <p class="text-gray-500">
            Calendario de llamadas y citas
        </p>

    </div>

    <div class="bg-white rounded-2xl shadow-sm p-6">

        <div id="calendar"></div>

    </div>

</div>

{% endblock %}

<style>

.fc-timegrid-slot {
    height: 3.5rem !important;
}

.fc-event {
    min-height: 55px;
    padding: 4px;
}

</style>

{% block extra_js %}

<link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const calendarEl =
            document.getElementById("calendar");

        const calendar =
            new FullCalendar.Calendar(
                calendarEl,
                {

                    locale: "es",

                    initialView:
                        "timeGridWeek",

                    height:
                        "auto",

                    slotMinTime: "06:00:00",
                    slotMaxTime: "19:00:00",
                    allDaySlot: false,
                    slotDuration: "00:30:00",
                    nowIndicator: true,

                    headerToolbar: {

                        left:
                            "prev,next today",

                        center:
                            "title",

                        right:
                            "dayGridMonth,timeGridWeek,timeGridDay"

                        

                    },

                    events:
                        "{% url 'calendar_events' %}",

                }
            );

        calendar.render();

    }
);

</script>

{% endblock %}
