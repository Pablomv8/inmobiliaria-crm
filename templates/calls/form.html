{% extends 'base.html' %}

{% block content %}

<div class="max-w-xl mx-auto p-6">

    <div class="bg-white border rounded-2xl p-6 space-y-6">

        <h1 class="text-xl font-semibold">
            Nueva llamada
        </h1>

        <p class="text-gray-500 text-sm">
            {{ news.related_property.full_address }}
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="space-y-4">

                <div>

                    <label class="block mb-2 font-medium">
                        Fecha
                    </label>

                    {{ form.date }}

                </div>

                {{ form.time }}

                <div>

                    <label class="block mb-2 font-medium">
                        Hora disponible
                    </label>

                    <div class="flex gap-4 mb-3 text-sm">

                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-green-400"></div>
                            Libre
                        </div>

                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-red-400"></div>
                            Ocupado
                        </div>

                    </div>

                    <div
                        id="slots-container"
                        class="grid grid-cols-3 md:grid-cols-4 gap-2"
                    >
                    </div>

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Notas
                    </label>

                    {{ form.notes }}

                </div>

            </div>

            <button
                type="submit"
                class="w-full mt-6 bg-black text-white py-3 rounded-xl"
            >
                Guardar llamada
            </button>

        </form>

    </div>

</div>

<script>

const dateInput =
    document.getElementById("id_date");

const timeInput =
    document.getElementById("id_time");

const container =
    document.getElementById("slots-container");


function generateHours() {

    const slots = [];

    for (let hour = 6; hour <= 19; hour++) {

        slots.push(
            `${String(hour).padStart(2,"0")}:00`
        );

        if (hour < 19) {

            slots.push(
                `${String(hour).padStart(2,"0")}:30`
            );
        }
    }

    return slots;
}


async function loadSlots() {

    if (!dateInput.value)
        return;

    const response = await fetch(
        `/calendar/available-slots/?date=${dateInput.value}`
    );

    const data = await response.json();

    container.innerHTML = "";

    generateHours().forEach(slot => {

        const occupied =
            data.occupied.includes(slot);

        const button =
            document.createElement("button");

        button.type = "button";

        button.innerText = slot;

        if (occupied) {

            button.disabled = true;

            button.className =
                "p-2 rounded-lg bg-red-100 text-red-600 text-sm";

        } else {

            button.className =
                "p-2 rounded-lg bg-green-100 text-green-700 text-sm hover:bg-green-200";

            button.addEventListener(
                "click",
                () => {

                    timeInput.value = slot;

                    document
                        .querySelectorAll(
                            "#slots-container button"
                        )
                        .forEach(
                            b => b.classList.remove(
                                "ring-2",
                                "ring-black"
                            )
                        );

                    button.classList.add(
                        "ring-2",
                        "ring-black"
                    );
                }
            );
        }

        container.appendChild(button);

    });

}

dateInput.addEventListener(
    "change",
    loadSlots
);

window.addEventListener(
    "load",
    loadSlots
);

</script>

{% endblock %}
