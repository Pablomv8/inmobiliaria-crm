{% extends "base.html" %}

{% block content %}

<div class="max-w-2xl mx-auto p-6">

    <!-- HEADER -->
    <div class="mb-6">

        <a href="{% url 'property_detail' property.id %}"
           class="text-sm text-gray-500 hover:text-black">

            ← Volver al inmueble

        </a>

        <h1 class="text-2xl font-bold mt-3">
            Añadir propietario existente
        </h1>

        <p class="text-sm text-gray-500 mt-1">
            {{ property.full_address }}
        </p>

    </div>

    <!-- CARD -->
    <div class="bg-white border rounded-2xl shadow-sm p-6">

        <form method="post" class="space-y-5">

            {% csrf_token %}

            <!-- SELECT CONTACT -->
            <div>

                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Seleccionar propietario
                </label>

                <select name="contact_id"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 bg-white focus:border-gray-900 focus:ring-2 focus:ring-gray-200">

                    <option value="">
                        -- Selecciona un contacto --
                    </option>

                    {% for contact in contacts %}

                        <option value="{{ contact.id }}">

                            {{ contact.name }}
                            {% if contact.phone %}
                                · {{ contact.phone }}
                            {% endif %}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <!-- INFO HELP -->
            <div class="bg-gray-50 rounded-xl p-4 text-sm text-gray-600">

                💡 Solo se muestran contactos marcados como propietarios.
                Puedes asignar este contacto directamente a este inmueble.

            </div>

            <!-- BUTTON -->
            <button type="submit"
                    class="w-full bg-black text-white py-3 rounded-xl hover:bg-gray-900 transition">

                Añadir propietario

            </button>

        </form>

    </div>

</div>

{% endblock %}
