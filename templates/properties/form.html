{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto p-6">

    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">

        <h1 class="text-3xl font-bold text-gray-800 mb-8">
            {{ title }}
        </h1>

        <form
            method="POST"
            enctype="multipart/form-data"
            class="space-y-6"
        >

            {% csrf_token %}

            <!-- Title -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Título
                </label>

                {{ form.title }}

            </div>

            <!-- Address -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Dirección
                </label>

                {{ form.address }}

            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>

                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Ciudad
                    </label>

                    {{ form.city }}

                </div>

                <div>

                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Precio
                    </label>

                    {{ form.price }}

                </div>

                <div>

                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Tipo
                    </label>

                    {{ form.property_type }}

                </div>

            </div>

            <!-- Image -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Imagen
                </label>

                {{ form.image }}

            </div>

            <!-- Description -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Descripción
                </label>

                {{ form.description }}

            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4 pt-4">

                <button
                    type="submit"
                    class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-3 rounded-xl transition"
                >
                    Guardar
                </button>

                <a
                    href="{% url 'properties' %}"
                    class="text-gray-600 hover:text-gray-900"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
