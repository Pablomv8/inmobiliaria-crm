{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8">

            <!-- Logo -->
            <div class="mb-8 text-center">

                <h1 class="text-4xl font-bold text-gray-800">
                    InmoCRM
                </h1>

                <p class="text-gray-500 mt-2">
                    Accede a tu cuenta
                </p>

            </div>

            <!-- Error -->
            {% if error %}

                <div class="mb-6 bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded-xl">

                    {{ error }}

                </div>

            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <!-- Username -->
                <div>

                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:bg-white focus:border-gray-900 focus:ring-2 focus:ring-gray-200 focus:outline-none transition"
                    >

                </div>

                <!-- Password -->
                <div>

                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:bg-white focus:border-gray-900 focus:ring-2 focus:ring-gray-200 focus:outline-none transition"
                    >

                </div>

                <!-- Button -->
                <button
                    type="submit"
                    class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-medium transition"
                >
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>

</body>

</html>
