{% load static %}
<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Sin conexión · InmoCRM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f4f6;
            color: #111827;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            background: #fff;
            text-align: center;
            box-shadow: 0 18px 45px rgba(17, 24, 39, .09);
        }
        img { width: 80px; height: 80px; border-radius: 20px; }
        h1 { margin: 22px 0 10px; font-size: 26px; }
        p { margin: 0; color: #4b5563; line-height: 1.6; }
        button {
            margin-top: 24px;
            padding: 12px 20px;
            border: 0;
            border-radius: 12px;
            background: #111827;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="{% static 'pwa/icon-192.png' %}" alt="Icono de InmoCRM">
        <h1>Sin conexión</h1>
        <p>No podemos acceder al CRM en este momento. Por seguridad, los datos de clientes e inmuebles no se almacenan en el dispositivo.</p>
        <button type="button" onclick="window.location.reload()">Volver a intentarlo</button>
    </main>
</body>
</html>
