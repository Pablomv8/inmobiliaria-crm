{% if request.user.is_authenticated %}<header class="sticky top-0 z-30 flex h-20 w-full min-w-0 max-w-full shrink-0 items-center border-b border-gray-200 bg-white px-4 sm:px-6 lg:px-8">
    <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-xl text-xl text-gray-700 hover:bg-gray-100 lg:hidden"
        @click="sidebarOpen = true"
        aria-label="Abrir menú principal"
    >
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- User -->
    <div class="ml-auto flex items-center gap-3 sm:gap-4">

        <button
            type="button"
            data-pwa-install
            hidden
            class="inline-flex h-11 items-center justify-center gap-2 rounded-xl border border-indigo-100 bg-indigo-50 px-3 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-100 sm:px-4"
            aria-label="Instalar InmoCRM en este dispositivo"
        >
            <i class="fa-solid fa-arrow-down-to-bracket"></i>
            <span class="hidden sm:inline">Instalar</span>
        </button>

        <div class="min-w-0 text-right">

            <p class="max-w-40 truncate font-semibold text-gray-800">
                {{ request.user.get_full_name|default:request.user.username }}
            </p>

            <p class="text-sm text-gray-500">
                {{ request.user.get_role_display }}
            </p>
            <a
                href="{% url 'logout' %}"
                class="text-sm text-red-500 hover:text-red-700"
            >
                Cerrar sesión
            </a>


        </div>

        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-gray-900 font-bold text-white">
            {{ request.user.username|first|upper }}
        </div>

    </div>

</header>{% endif %}
