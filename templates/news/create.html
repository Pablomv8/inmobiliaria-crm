{% extends 'base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-2xl p-8 shadow-sm">

        <h1 class="text-3xl font-bold mb-2">

            Nueva noticia

        </h1>

        <p class="text-gray-500 mb-8">

            {{ property.title }}

        </p>

        <form method="post">

            {% csrf_token %}

            <div class="space-y-6">

                {{ form.as_p }}

            </div>

            <div class="mt-8 flex justify-end">

                <button
                    class="px-5 py-3 rounded-xl text-white transition"
                    style="background-color:#2563eb;"
                >
                    Guardar noticia
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
