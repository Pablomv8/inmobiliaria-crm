name: Validación del CRM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-outside-tests-12345678901234567890
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://crm:crm_test_password@127.0.0.1:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --parallel 2 --verbosity 1
      - run: python manage.py collectstatic --noinput

  deployment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_SECRET_KEY: ci-production-check-key-1234567890123456789012345678901234567890
      DJANGO_ALLOWED_HOSTS: crm.example.test
      DJANGO_CSRF_TRUSTED_ORIGINS: https://crm.example.test
      DATABASE_URL: sqlite:///ci-production-check.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy

  render-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de Render
        run: docker build --tag inmobiliaria-crm:render .
      - name: Arrancar y comprobar el contenedor
        run: |
          docker run --detach --name crm-render \
            --publish 127.0.0.1:10000:10000 \
            --env PORT=10000 \
            --env DJANGO_SETTINGS_MODULE=config.settings_production \
            --env DJANGO_SECRET_KEY=ci-render-container-key-1234567890123456789012345678901234567890 \
            --env DJANGO_ALLOWED_HOSTS=crm.example.test \
            --env DJANGO_CSRF_TRUSTED_ORIGINS=https://crm.example.test \
            --env DATABASE_URL=sqlite:////tmp/render.sqlite3 \
            --env DJANGO_MEDIA_ROOT=/tmp/media \
            --env CRM_BACKUP_ROOT=/tmp/backups \
            inmobiliaria-crm:render

          for attempt in {1..30}; do
            if curl --fail --silent \
              --header 'Host: crm.example.test' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:10000/health/ready/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs crm-render
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent \
            --header 'Host: crm.example.test' \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:10000/static/css/main.min.css \
            --output /dev/null
      - name: Mostrar logs si falla
        if: failure()
        run: docker logs crm-render
      - name: Retirar el contenedor
        if: always()
        run: docker rm --force crm-render || true
